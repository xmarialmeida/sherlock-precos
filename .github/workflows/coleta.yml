name: Coletar preços

on:
  schedule:
    # 11:17 e 23:17 UTC = 08:17 e 20:17 no horário de Brasília
    - cron: "17 11,23 * * *"
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write # necessário para o robô salvar o histórico no repositório

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar o coletor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIAR_RESUMO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scraper.py

      - name: Salvar histórico
        run: |
          git config user.name "rastreador-bot"
          git config user.email "rastreador-bot@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "Atualiza histórico de preços" && git push)
