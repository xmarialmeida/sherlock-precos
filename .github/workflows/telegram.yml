name: Ouvir Telegram

on:
  workflow_dispatch: # acionado na hora pelo "porteiro" (worker.js) ou manualmente
    inputs:
      atualizacao:
        description: "Mensagem entregue pelo porteiro (deixe vazio ao rodar manualmente)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ouvir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar o bot e salvar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ATUALIZACAO: ${{ inputs.atualizacao }}
        run: |
          git config user.name "rastreador-bot"
          git config user.email "rastreador-bot@users.noreply.github.com"
          # Se outro processo gravar no mesmo instante, pega a versão nova e refaz.
          for tentativa in 1 2 3 4; do
            python bot.py
            git add -A products.json data
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "Bot: atualiza produtos"
            if git push; then exit 0; fi
            echo "Outro processo gravou ao mesmo tempo; refazendo (tentativa $tentativa)..."
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
