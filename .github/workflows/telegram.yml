name: Ouvir Telegram

on:
  schedule:
    - cron: "*/15 * * * *" # confere novas mensagens a cada ~15 minutos
  workflow_dispatch: # permite rodar manualmente

permissions:
  contents: write

# garante que o bot e o coletor de preços nunca gravem os mesmos arquivos ao mesmo tempo
concurrency:
  group: rastreador-dados
  cancel-in-progress: false

jobs:
  ouvir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Salvar alterações
        run: |
          git config user.name "rastreador-bot"
          git config user.email "rastreador-bot@users.noreply.github.com"
          git add products.json data/history.json data/bot_state.json
          git diff --staged --quiet || (git commit -m "Bot: atualiza produtos" && git pull --rebase && git push)
